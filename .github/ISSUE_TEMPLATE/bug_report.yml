name: Bug report / 缺陷报告
description: Something broke in the workbench. / 工作台某个地方不对劲。
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈。请先确认：数据是浏览器本地的，**清缓存前请导出 JSON 备份**。
  - type: textarea
    id: what-happened
    attributes:
      label: 发生了什么 / What happened
      description: 期望的行为 vs 实际的行为。
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤 / Steps to reproduce
      placeholder: |
        1. 打开「剧情因果」
        2. 拖动节点右边缘到 5 格
        3. 松开后发现……
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: 插件版本 / Plugin version
      placeholder: 1.3.0
    validations:
      required: true
  - type: input
    id: dsh-version
    attributes:
      label: DSH 版本 / DeepSeek Harness version
      placeholder: 0.1.3-alpha.1
  - type: dropdown
    id: language
    attributes:
      label: 界面语言 / UI language
      options:
        - 中文
        - English
        - 两者都有 / Both
  - type: textarea
    id: console
    attributes:
      label: 控制台报错 / Console errors
      description: 开发者工具 Console 里的报错（有就贴，没有留空）。
      render: shell
